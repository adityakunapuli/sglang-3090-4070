# yaml-language-server: $schema=http://192.168.254.111:5000/api/config/schema.json
version: 0.17-0

mqtt:
  host: '{FRIGATE_MQTT_HOST}'
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  nvidia:
    type: onnx
#    device: '2'

model:
  path: /models/deimv2/deimv2_hgnetv2_n.onnx
  model_type: dfine
  width: 640
  height: 640
  input_tensor: nchw
  input_dtype: float

#model:
#  path: /models/rfdetr/rfdetr-n-384.onnx
#  model_type: rfdetr
#  width: 384
#  height: 384
#  input_tensor: nchw
#  input_dtype: float
#  labelmap_path: /config/models/coco_80.txt

record:
  # Optional: Enable recording (default: shown below)
  # WARNING: If recording is disabled in the config, turning it on via
  #          the UI or MQTT later will have no effect.
  enabled: false
  # Optional: Number of minutes to wait between cleanup runs (default: shown below)
  # This can be used to reduce the frequency of deleting recording segments from disk if you want to minimize i/o
  expire_interval: 60
  # Optional: Two-way sync recordings database with disk on startup and once a day (default: shown below).
  sync_recordings: true

go2rtc:
  streams:
    front_doorbell:
      - ffmpeg:http://{FRIGATE_DOORBELL_IP}/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_DOORBELL_USER}&password={FRIGATE_DOORBELL_PASSWORD}#video=copy#audio=copy#audio=opus
      - rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_IP}:554/h264Preview_01_main
    front_doorbell_sub:
      - ffmpeg:http://{FRIGATE_DOORBELL_IP}/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_DOORBELL_USER}&password={FRIGATE_DOORBELL_PASSWORD}
      - rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_IP}:554/h264Preview_01_sub
    tapo_c260:
      - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@{FRIGATE_TAPO_IP}:554/stream1
    tapo_sub:
      - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@{FRIGATE_TAPO_IP}:554/stream2

ffmpeg:
  hwaccel_args: preset-nvidia-h264
  output_args:
    record: preset-record-generic-audio-aac

cameras:
  front_doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_doorbell
          input_args: preset-rtsp-restream
          hwaccel_args: preset-nvidia-h264
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/front_doorbell_sub
          input_args: preset-rtsp-restream
          hwaccel_args: preset-nvidia-h264
          roles:
            - detect
            - audio
    detect:
      width: 896
      height: 672
      fps: 5
    snapshots:
      enabled: true
      retain:
        default: 7
      timestamp: true
      bounding_box: true
      crop: true
      quality: 75
    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
      detections:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
    objects:
      track:
        - person
        - car
        - motorbike
        - bus
        - truck
        - bicycle
        - dog
        - cat
        - skateboard
      filters:
        person:
          min_score: 0.40
          threshold: 0.60
          min_area: 1000
      mask:
        - 0,0.676,0.197,0.711,0.387,0.712,0.445,0.994,0,1
        - 0.517,0.702,0.992,0.595,0.997,0.724,0.817,0.82
    review:
      alerts:
        required_zones:
          - Sidewalk-Street
          - Front_Entry
    zones:
      Front_Entry:
        coordinates: 
          0.453,1,1,1,0.828,0.865,0.756,0.937,0.507,0.7,0.45,0.71,0.393,0.71
      Sidewalk-Street:
        coordinates: 
          0,0.486,0.359,0.489,0.522,0.5,0.699,0.487,0.851,0.487,1,0.459,1,0.594,0.604,0.685,0.455,0.705,0.197,0.706,0,0.667
    motion:
      mask:
        - 0.247,0.012,0.721,0.016,0.724,0.062,0.25,0.056
        - 0,0,0.17,0,0.172,0.141,0.189,0.191,0.177,0.237,0.284,0.375,0.308,0.482,0.217,0.491,0.163,0.484,0.067,0.466,0,0.449
        - 0.972,0.46,0.855,0.483,0.731,0.442,0.733,0.181,0.838,0.11,0.888,0.115,0.917,0.257,1,0.293
        - 0.53,0.394,0.485,0.474,0.517,0.495,0.559,0.48

  tapo_c260:
    enabled: true
    onvif:
      host: 192.168.254.202
      port: 2020
      user: '{FRIGATE_TAPO_USER}'
      password: '{FRIGATE_TAPO_PASSWORD}'
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_c260
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/tapo_sub
          input_args: preset-rtsp-restream
          hwaccel_args: preset-nvidia-h264
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      genai:
        enabled: false
    snapshots:
      enabled: true
      retain:
        default: 7
      timestamp: true
      bounding_box: true
      crop: true
      quality: 75
    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
      detections:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5

    motion:
      mask: 0.396,0.05,0,0.058,0,0,0.396,0
detect:
  enabled: true

genai:
  provider: openai
  api_key: '{FRIGATE_GENAI_API_KEY}'
  base_url: '{FRIGATE_GENAI_BASE_URL}'
  model: Gemma-4

semantic_search:
  enabled: true
  model_size: large

face_recognition:
  enabled: true
  model_size: large

lpr:
  enabled: false

classification:
  bird:
    enabled: false
  custom:
    Dog:
      enabled: true
      name: Dog
      threshold: 0.8
      object_config:
        objects:
          - dog
        classification_type: sub_label

objects:
  genai:
    enabled: true
    prompt: |
      Analyze the {label} in these images from the {camera} security camera. Focus on the actions, behavior, and potential intent of the {label}, rather than just describing its appearance.

      ### Normal Activity Indicators (Level 0)
      - Known/verified people in any zone at any time
      - People with pets in residential areas
      - Deliveries or services during daytime/evening (6 AM - 10 PM): carrying packages to doors/porches, placing items, leaving
      - Services/maintenance workers with visible tools, uniforms, or service vehicles during daytime
      - Activity confined to public areas only (sidewalks, streets) without entering property at any time

      ### Suspicious Activity Indicators (Level 1)
      - **Testing or attempting to open doors/windows/handles on vehicles or buildings** — ALWAYS Level 1 regardless of time or duration
      - **Unidentified person in private areas (driveways, near vehicles/buildings) during late night/early morning (11 PM - 5 AM)** — ALWAYS Level 1 regardless of activity or duration
      - Taking items that don't belong to them (packages, objects from porches/driveways)
      - Climbing or jumping fences/barriers to access property
      - Attempting to conceal actions or items from view
      - Prolonged loitering: remaining in same area without visible purpose throughout most of the sequence

      ### Critical Threat Indicators (Level 2)
      - Holding break-in tools (crowbars, pry bars, bolt cutters)
      - Weapons visible (guns, knives, bats used aggressively)
      - Forced entry in progress
      - Physical aggression or violence
      - Active property damage or theft in progress

      ### Assessment Guidance
      Evaluate in this order:

      1. **If person is verified/known** → Level 0 regardless of time or activity
      2. **If person is unidentified:**
        - Check time: If late night/early morning (11 PM - 5 AM) AND in private areas (driveways, near vehicles/buildings) → Level 1
        - Check actions: If testing doors/handles, taking items, climbing → Level 1
        - Otherwise, if daytime/evening (6 AM - 10 PM) with clear legitimate purpose (delivery, service worker) → Level 0
      3. **Escalate to Level 2 if:** Weapons, break-in tools, forced entry in progress, violence, or active property damage visible (escalates from Level 0 or 1)

      The mere presence of an unidentified person in private areas during late night hours is inherently suspicious and warrants human review, regardless of what activity they appear to be doing or how brief the sequence is.
    object_prompts:
      person: Examine the main person in these images. What are they doing and 
        what might their actions suggest about their intent (e.g., approaching a
        door, leaving an area, standing still)? Do not describe the surroundings
        or static details.
      car: Observe the primary vehicle in these images. Focus on its movement, 
        direction, or purpose (e.g., parking, approaching, circling). If it's a 
        delivery vehicle, mention the company.
