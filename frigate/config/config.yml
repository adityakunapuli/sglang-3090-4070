# yaml-language-server: $schema=http://192.168.254.111:5000/api/config/schema.json
version: 0.17-0

logger:
  default: info
  logs:
    frigate.record.maintainer: debug
    frigate.ffmpeg: debug

mqtt:
  host: '{FRIGATE_MQTT_HOST}'
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  nvidia:
    type: onnx

model:
  path: /models/deimv2/deimv2_hgnetv2_n.onnx
  model_type: dfine
  width: 640
  height: 640
  input_tensor: nchw
  input_dtype: float

record:
  enabled: true
  expire_interval: 60
  sync_recordings: true

go2rtc:
  streams:
    front_doorbell:
      - rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_IP}:554/Preview_01_main#backchannel=0&transport=tcp
    front_doorbell_sub:
      # - ffmpeg:front_doorbell#video=h264#vf=scale=640:480
      - rtsp://{FRIGATE_DOORBELL_USER}:{FRIGATE_DOORBELL_PASSWORD}@{FRIGATE_DOORBELL_IP}:554/Preview_01_sub#backchannel=0&transport=tcp
    tapo_c260:
      - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@{FRIGATE_TAPO_IP}:554/stream1#backchannel=0&transport=tcp
    tapo_sub:
      - rtsp://{FRIGATE_TAPO_USER}:{FRIGATE_TAPO_PASSWORD}@{FRIGATE_TAPO_IP}:554/stream2#backchannel=0&transport=tcp

ffmpeg:
  hwaccel_args: preset-nvidia-h264
  output_args:
    record: preset-record-generic-audio-aac

review:
  genai:
    enabled: True

cameras:
  front_doorbell:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_doorbell
          input_args: preset-rtsp-restream
          hwaccel_args: preset-nvidia-h264
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/front_doorbell_sub
          input_args: preset-rtsp-restream
          hwaccel_args: preset-nvidia-h264
          roles:
            - detect
            - audio
    detect:
      width: 640
      height: 480
      fps: 5
    snapshots:
      enabled: true
      retain:
        default: 7
    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
      detections:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
    objects:
      genai:
        enabled: True
        prompt: >
          This description is for a Frigate security pipeline ({camera}).
          Analyze the intent and actions of the {label} naturally. 
          Start the description directly.
          CRITICAL: DO NOT identify or mention "license plates". DO NOT use "license plate" as a sub-label or description. 
          Focus on:
          1. Behavior: (e.g., approaching, lingering, appearing suspicious). NOTE: Any person approaching the door past 12 AM (midnight) should be flagged as suspicious.
          2. Appearance: Describe clothing (e.g., mask/balaclava, colors) and items carried (e.g., backpack, tools/crowbar).
          3. Context: Note if the activity is unusual for the time of day.
          Highlight anything unusual. Do not describe static surroundings.
      track:
        - person
        - car
        - dog
        - cat
        - suitcase
        - backpack
      filters:
        person:
          min_score: 0.40
          threshold: 0.60
          min_area: 1000
    review:
      alerts:
        required_zones:
          - Sidewalk-Street
          - Front_Entry
    zones:
      Front_Entry:
        coordinates: 0.453,1,1,1,0.828,0.865,0.756,0.937,0.507,0.7,0.45,0.71,0.393,0.71
      Sidewalk-Street:
        coordinates: 0,0.486,0.359,0.489,0.522,0.5,0.699,0.487,0.851,0.487,1,0.459,1,0.594,0.604,0.685,0.455,0.705,0.197,0.706,0,0.667
    motion:
      mask:
        - 0.247,0.012,0.721,0.016,0.724,0.062,0.25,0.056
        - 0,0,0.17,0,0.172,0.141,0.189,0.191,0.177,0.237,0.284,0.375,0.308,0.482,0.217,0.491,0.163,0.484,0.067,0.466,0,0.449
        - 0.972,0.46,0.855,0.483,0.731,0.442,0.733,0.181,0.838,0.11,0.888,0.115,0.917,0.257,1,0.293
        - 0.53,0.394,0.485,0.474,0.517,0.495,0.559,0.48

  tapo_c260:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_c260
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/tapo_sub
          input_args: preset-rtsp-restream
          hwaccel_args: preset-nvidia-h264
          roles:
            - detect
            - audio
    detect:
      width: 1280
      height: 720
      fps: 5
    audio:
      enabled: true
      listen:
        - glass_breaking
        - fire_alarm
        - explosion
        - laughter
        - crying
        - scream
        - shout
        - speech
        - yell
    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
      detections:
        retain:
          days: 7
          mode: active_objects
        pre_capture: 5
        post_capture: 5
    objects:
      track:
        - person
      genai:
        enabled: True
        prompt: >
          This description is for a Frigate camera pipeline monitoring the Master Bedroom. 
          Identify the people as follows: man is Dad, baby is Dani, woman is Mom. 
          Describe the activity of {sub_label} (or {label}) naturally, starting the description directly without any "Based on the image" preambles.
          For trivial sleep movements or stirring, provide only a single concise sentence.
          For significant activity, unusual events (e.g. falling), or ANY instance of someone speaking while the camera is in black and white (nightvision), provide a thorough and detailed description.
          Focus on actions and behavior. Be proportional: simple movements get simple summaries; emergencies or nightvision speech get full detail.
    motion:
      mask: 0.396,0.05,0,0.058,0,0,0.396,0

detect:
  enabled: true

genai:
  provider: openai
  api_key: '{FRIGATE_GENAI_API_KEY}'
  base_url: http://litellm:4000/v1
  model: gemma-12b-mtp

semantic_search:
  enabled: true
  model_size: large

face_recognition:
  enabled: true
  model_size: large

classification:
  bird:
    enabled: false
  custom:
    Dog:
      enabled: true
      name: Dog
      threshold: 0.8
      object_config:
        objects:
          - dog
        classification_type: sub_label
    package_delivery:
      enabled: true
      name: Package
      threshold: 0.8
      object_config:
        objects:
          - suitcase
          - backpack
        classification_type: sub_label
