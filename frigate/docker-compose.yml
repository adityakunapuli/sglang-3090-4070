services:
  frigate:
    container_name: frigate
    privileged: false # Keep disabled to enforce GPU device constraints
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable-tensorrt
    shm_size: "4gb" # Sufficient for ~4-6 1080p cameras. Increase if you see bus errors.
    runtime: nvidia
    env_file:
      - .env
      - ../genai.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_3050:?GPU_3050_UUID_NOT_SET}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_VISIBLE_DEVICES=${GPU_3050:?GPU_3050_UUID_NOT_SET}
      - FFMPEG_DISABLE_GAMMA_EQUALIZER=true
      - LIBVA_DRIVER_NAME=nvidia
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - OPENAI_BASE=http://litellm:4000/v1
      - OPENAI_API_KEY=${FRIGATE_GENAI_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - /mnt/disk5/frigate_media:/media/frigate
#      - /mnt/data/media_cache/frigate:/media/frigate
      - /mnt/data/models/frigate-detectors:/models
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 4gb
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["all"]  # MUST expose all device ids in order for hwaccel to work
#              device_ids: ['GPU-f1690852-7dc1-2557-d0f9-93cd6b19b877']
#              device_ids: ["${GPU_3050:?GPU_3050_UUID_NOT_SET}"]
              capabilities: [all]
    networks:
      - default
      - proxy
    labels:
      - "wud.watch.digest=true"
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`frigate.home.lan`)"
      - "traefik.http.routers.frigate.entrypoints=web"
      - "traefik.http.services.frigate.loadbalancer.server.port=5000"
      - "homepage.1.group=Home Ops"
      - "homepage.1.name=Frigate"
      - "homepage.1.icon=frigate.png"
      - "homepage.1.href=http://192.168.254.111:5000"
      - "homepage.1.description=NVR & Object Detection"
      - "homepage.1.widget.type=frigate"
      - "homepage.1.widget.url=http://frigate:5000"
      - "homepage.2.group=Home Ops"
      - "homepage.2.name=Frigate Stats"
      - "homepage.2.icon=mdi-chart-line"
      - "homepage.2.href=http://192.168.254.111:5000"
      - "homepage.2.description=Inference & GPU"
      - "homepage.2.widget.type=customapi"
      - "homepage.2.widget.url=http://frigate:5000/api/stats"
      - "homepage.2.widget.refreshInterval=5000"
      - 'homepage.2.widget.mappings=[{"field": "detectors.nvidia.inference_speed", "label": "Inf. Speed", "suffix": "ms"}, {"field": "gpu_usages[\"NVIDIA GeForce RTX 3050\"].mem", "label": "GPU Mem"}]'


networks:
  proxy:
    external: true
