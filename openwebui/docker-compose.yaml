services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3030:8080"
    environment:
      - OPENAI_API_BASE_URL=${GATEWAY_URL}
      - OPENAI_API_KEY=openwebui
      - WEBUI_AUTH=False
      - ENABLE_PERSISTENT_CONFIG=False
      - RESET_CONFIG_ON_START=True
    volumes:
      - ./config:/app/backend/data
    networks:
      - default
      - proxy
    labels:
        - "homepage.group=AI"
        - "homepage.name=Open WebUI"
        - "homepage.icon=/icons/openwebui.png"
#        - "homepage.description=LLM Web Interface"
        - "homepage.href=http://192.168.254.111:3030"
        - "homepage.target=_self"

networks:
  proxy:
    external: true
