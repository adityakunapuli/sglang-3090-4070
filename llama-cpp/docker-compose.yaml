services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    # MUST remain disabled to prevent automatic restart loops after OOM-induced system collapse.
    restart: "no"  # DO NOT CHANGE
    ports:
      - "9876:9876"
    volumes:
      - /mnt/data/models/llm:/mnt/data/models/llm
      - ./qwen35-27b.sh:/app/run_server.sh:ro
#      - ./gemma-4-31b.sh:/app/run_server.sh:ro
#      - ./qwen35-9b.sh:/app/run_server.sh:ro
    environment:
      - LLAMA_CACHE=/mnt/data/models/llm
      - HF_HOME=/mnt/data/models/llm
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /app
    entrypoint: [ "/bin/bash", "/app/run_server.sh" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9876/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [
                'GPU-88a93309-9467-dab9-9491-30f298a784f1', # GPU LONG (RTX 3060 12GB)
                'GPU-5a6bd876-90f0-e6cf-a89e-ed47392ceb59'  # GPU SHORT (RTX 3060 12GB)
              ]
              capabilities: [ gpu ]
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llama.rule=Host(`llama.home.lan`)"
      - "traefik.http.routers.llama.entrypoints=web"
      - "traefik.http.services.llama.loadbalancer.server.port=9876"

networks:
  proxy:
    external: true
