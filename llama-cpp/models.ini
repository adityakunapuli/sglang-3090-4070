version = 1

[*]
# Global infrastructure defaults for PC2
host = 0.0.0.0
flash-attn = true
parallel = 1
n-gpu-layers = 99
split-mode = layer
tensor-split = 1,1
fit = off

[Gemma-4-26B]
model = /mnt/data/models/llm/Gemma/26B-A4B/gemma-4-26B-A4B-it-UD-IQ4_NL.gguf
mmproj = /mnt/data/models/llm/Gemma/26B-A4B/mmproj-BF16.gguf
reasoning = on
# Migrated defaults
tensor-split = 12,12
cache-type-k = q4_0
cache-type-v = q4_0
ctx-size = 65536

[Gemma-4-31B]
hf = unsloth/gemma-4-31B-it-qat-GGUF:UD-Q4_K_XL
mmproj = /mnt/data/models/llm/Gemma/31B/mmproj-BF16.gguf
temp = 1.0
top-p = 0.95
top-k = 64
reasoning = on
# Migrated defaults
tensor-split = 12,12
cache-type-k = q4_0
cache-type-v = q4_0
ctx-size = 65536


