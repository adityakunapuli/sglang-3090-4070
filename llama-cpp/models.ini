version = 1

[*]
# Global infrastructure defaults for PC2
host = 0.0.0.0
;flash-attn = on
;parallel = 1
;kv-unified = off
;n-gpu-layers = 999
;mmap = 0

[Gemma-4-26B]
model = /mnt/data/models/llm/Gemma/26B-A4B/gemma-4-26B-A4B-it-UD-IQ4_NL.gguf
mmproj = /mnt/data/models/llm/Gemma/26B-A4B/mmproj-BF16.gguf
chat-template-kwargs = {"enable_thinking":true}
# Migrated defaults
tensor-split = 12,12
cache-type-k = q4_0
cache-type-v = q4_0
ctx-size = 65536

[Gemma-4-31B]
model = /mnt/data/models/llm/Gemma/gemma-4-31B-it-IQ4_NL.gguf
mmproj = /mnt/data/models/llm/Gemma/31B/mmproj-BF16.gguf
chat-template-kwargs = {"enable_thinking":true}
# Migrated defaults
tensor-split = 12,12
cache-type-k = q4_0
cache-type-v = q4_0
ctx-size = 65536

[Gemma-4-12B-MTP]
model = /mnt/data/models/llm/Gemma/12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
model-draft = /mnt/data/models/llm/Gemma/12B/gemma-4-12B-it-qat-assistant-MTP-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 64
ctx-size = 262144

# Working
[Qwen3.6-27B]
model = /mnt/data/models/llm/Qwen3.6/27B-MTB/Qwen3.6-27B-Q4_K_S.gguf
# Tensor Parallel & Device Selection
split-mode = tensor
tensor-split = 1,1
fit = off
# Offloading & Threading
n-gpu-layers = 99
threads = 0
parallel = 1

# Flash Attention & Unified Memory Optimization
flash-attn = true
kv-unified = true
ctx-size = 64000

# Speculative Drafting (MTP Config)
spec-type = draft-mtp
spec-draft-n-max = 1
no-mmproj-offload = true

# Sampling & Penalties (Instruct Mode: Technical Troubleshooting)
reasoning = off
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0

# Force llama-server to handle the chat template without a thinking trace
chat-template-kwargs = {"preserve_thinking":false}



