services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - NVIDIA_VISIBLE_DEVICES=${GPU_3050:?GPU_3050_UUID_NOT_SET}
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /mnt/data/media_cache/jellyfin:/config
      - /mnt/storage/media:/data
    ports:
      - "8096:8096"
    networks:
      - default
      - proxy
    labels:
        - "homepage.group=Media Automation"
        - "homepage.name=Jellyfin"
        - "homepage.icon=jellyfin.png"
        - "homepage.href=http://192.168.254.111:8096"
        - "homepage.widget.type=jellyfin"
        - "homepage.widget.url=http://192.168.254.111:8096"
        - "homepage.widget.key=${JELLYFIN_API_KEY}"
        - "homepage.target=_self"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_3050:?GPU_3050_UUID_NOT_SET}']
              capabilities: [gpu, compute, video, utility]
    restart: unless-stopped

networks:
  proxy:
    external: true
