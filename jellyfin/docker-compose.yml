services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - NVIDIA_VISIBLE_DEVICES=${GPU_SLOT_3:?GPU_SLOT_3_NOT_SET}
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /mnt/data/media_cache/jellyfin:/config
      - /mnt/storage/media:/data
    ports:
      - "8096:8096"
    networks:
      - default
      - proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_SLOT_3:?GPU_SLOT_3_NOT_SET}']
              capabilities: [gpu, compute, video, utility]
    restart: unless-stopped

networks:
  proxy:
    external: true
