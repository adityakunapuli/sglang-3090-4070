services:
  db:
    image: postgres:16-bookworm
    container_name: litellm-db-v4
    restart: unless-stopped
    labels:
      - "wud.watch=false"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - litellm_db_v4_data:/var/lib/postgresql/data
    networks:
      - proxy

  redis:
    image: redis:alpine
    container_name: litellm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_PASSWORD: ${UI_PASSWORD}
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "8" ]
    networks:
      - proxy
    labels:
      - "homepage.group=AI"
      - "homepage.name=LiteLLM Proxy"
      - "homepage.icon=/icons/litellm.png"
      - "homepage.href=http://192.168.254.111:4000"
      - "homepage.description=LLM Gateway & Scheduler UI"

volumes:
  litellm_db_v4_data:

networks:
  proxy:
    external: true
