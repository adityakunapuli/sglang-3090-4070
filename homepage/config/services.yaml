        description: Indexer Manager
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}
          showStats: true
    - Audiobookshelf:
        icon: audiobookshelf.png
        href: http://192.168.254.111:13378
        id: audiobookshelf
        description: Audiobooks & Podcasts
        widget:
          type: audiobookshelf
          url: http://audiobookshelf:13378
          key: {{HOMEPAGE_VAR_AUDIOBOOKSHELF_API_KEY}}
          showStats: true
    - Plex:
        icon: plex.png
        href: http://192.168.254.111:32400/web
        id: plex
        widget:
          type: plex
          url: http://192.168.254.111:32400
          key: {{HOMEPAGE_VAR_PLEX_KEY}}
          fields: ["streams", "movies", "tv"]
    - Jellyfin:
        icon: jellyfin.png
        href: http://192.168.254.111:8096
