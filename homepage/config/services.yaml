- Paperless Stack:
    - OCR-Sidecar:
        icon: /icons/ocr.svg
        href: http://192.168.254.111:8002
        target: _self
        id: openarchive-card
    - Paperless:
        icon: paperless.png
        href: http://192.168.254.111:8010
        target: _self
        id: paperless-card

- Home Ops:
    - Home Assistant:
        icon: home-assistant.png
        href: http://192.168.254.22:8123
        target: _self
        id: home-assistant-card
        description: Home Automation Platform
        widget:
          type: homeassistant
          url: http://192.168.254.22:8123
          key: {{HOMEPAGE_VAR_HA_TOKEN}}
    - Frigate:
        icon: frigate.png
        href: http://192.168.254.111:5000
        target: _self
        id: frigate-card
        description: NVR & Object Detection
        widget:
          type: frigate
          url: http://frigate:5000
          mappings:
            - field: detectors.nvidia.inference_speed
              label: Inf. Speed
              suffix: ms
            - field: gpu_usages["NVIDIA GeForce RTX 3050"].mem
              label: GPU Mem
    - Scrutiny:
        icon: /icons/scrutiny-white.svg
        href: http://192.168.254.111:8080
        target: _self
        id: scrutiny-card
        description: Drive Health Monitoring
        widget:
          type: scrutiny
          url: http://192.168.254.111:8080
          showStats: true
    - Immich:
        icon: immich.png
        href: http://192.168.254.111:2283
        target: _self
        id: immich-card
        description: Photo & Video Management
        widget:
          type: immich
          url: http://192.168.254.111:2283
          key: {{HOMEPAGE_VAR_IMMICH_API_KEY}}
          version: 2
          showStats: true
    - AdGuard Home:
        icon: adguard-home.png
        href: http://192.168.254.111:3001
        target: _self
        id: adguard-card
        widget:
          type: adguard
          url: http://192.168.254.111:3001
          username: {{HOMEPAGE_VAR_ADGUARD_USERNAME}}
          password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
    - Journiv:
        icon: mdi-notebook-outline
        href: http://192.168.254.111:8000
        target: _self
        id: journiv-card
        description: Self-hosted journal and milestone tracker

