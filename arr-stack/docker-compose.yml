services:
    # --- 1. DOWNLOADER & VPN (All-in-one) ---
    delugevpn:
        image: binhex/arch-delugevpn
        container_name: delugevpn
        privileged: true
        cap_add:
            - NET_ADMIN
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
        ports:
            - "8112:8112" # Web UI
            - "58846:58846" # Daemon Port
            - "8118:8118" # Privoxy
        environment:
            - VPN_ENABLED=yes
            - VPN_PROV=custom
            - VPN_CLIENT=wireguard
            - STRICT_PORT_FORWARD=yes
            - ENABLE_PRIVOXY=yes
            - LAN_NETWORK=192.168.254.0/24,172.16.0.0/12,172.30.0.0/16
            - NAME_SERVERS=1.1.1.1,1.0.0.1
            - DELUGE_DAEMON_LOG_LEVEL=info
            - WEBUI_PORT=8112
            - UMASK=000
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
        volumes:
            - /mnt/storage/media:/data
            - ./config/deluge:/config
            - ./config/vpn:/config/wireguard
        restart: unless-stopped
        networks:
            - default
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.deluge.rule=Host(`deluge.home.lan`)"
            - "traefik.http.routers.deluge.entrypoints=web"
            - "traefik.http.services.deluge.loadbalancer.server.port=8112"

    # --- 2. ARRRRRRRR ---
    radarr:
        image: linuxserver/radarr:latest
        container_name: radarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
        ports:
            - "7878:7878"
        volumes:
            - ./config/radarr:/config
            - /mnt/storage/media:/data
        restart: unless-stopped
        networks:
            - default
            - proxy
        labels:
            - "auto.arr=true"
            - "auto.arr.port=7878"
            - "traefik.enable=true"
            - "traefik.http.routers.radarr.rule=Host(`radarr.home.lan`)"
            - "traefik.http.routers.radarr.entrypoints=web"
            - "traefik.http.services.radarr.loadbalancer.server.port=7878"

    sonarr:
        image: linuxserver/sonarr:latest
        container_name: sonarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
        ports:
            - "8989:8989"
        volumes:
            - ./config/sonarr:/config
            - /mnt/storage/media:/data
        restart: unless-stopped
        networks:
            - default
            - proxy
        labels:
            - "auto.arr=true"
            - "auto.arr.port=8989"
            - "traefik.enable=true"
            - "traefik.http.routers.sonarr.rule=Host(`sonarr.home.lan`)"
            - "traefik.http.routers.sonarr.entrypoints=web"
            - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

    prowlarr:
        image: lscr.io/linuxserver/prowlarr:latest
        container_name: prowlarr
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
        ports:
            - "9696:9696"
        volumes:
            - ./config/prowlarr:/config
        restart: unless-stopped
        networks:
            - default
            - proxy
        labels:
            - "auto.arr=true"
            - "auto.arr.port=9696"
            - "traefik.enable=true"
            - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home.lan`)"
            - "traefik.http.routers.prowlarr.entrypoints=web"
            - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

    flaresolverr:
        image: flaresolverr/flaresolverr:latest
        container_name: flaresolverr
        environment:
            - LOG_LEVEL=info
            - TZ=America/Los_Angeles
        ports:
            - "8191:8191"
        restart: unless-stopped
#

networks:
  proxy:
    external: true
