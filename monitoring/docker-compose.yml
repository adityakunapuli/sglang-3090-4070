services:
  telegraf:
    container_name: telegraf
    image: telegraf:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /dev:/dev:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
    env_file:
      - ../.env
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    labels:
      - "homepage.group=System"
      - "homepage.name=Prometheus"
      - "homepage.icon=prometheus.png"
      - "homepage.href=http://192.168.254.111:9090"
      - "homepage.target=_self"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - 9090:9090
    networks:
      - monitoring

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - 9100:9100
    networks:
      - monitoring

  nvitop-exporter:
    container_name: nvitop-exporter
    image: ghcr.io/xuehaipan/nvitop-exporter:latest
    restart: unless-stopped
    runtime: nvidia
    pid: host
    volumes:
      - /proc:/host/proc:ro
    command:
      - '--port'
      - '5050'
      - '--bind-address'
      - '0.0.0.0'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    ports:
      - 5050:5050
    networks:
      - monitoring

  influxdb:
    container_name: influxdb
    image: influxdb:2
    restart: unless-stopped
    labels:
      - "homepage.group=System"
      - "homepage.name=InfluxDB"
      - "homepage.icon=influxdb.png"
      - "homepage.href=http://192.168.254.111:8087"
      - "homepage.target=_self"
    ports:
      - "${INFLUXDB_PORT:-8087}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    env_file:
      - ../.env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-InfluxDB-Admin-2026}
      - DOCKER_INFLUXDB_INIT_ORG=home
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_RETENTION=90d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-telemetry_token_xK9mP2vL7nQ4wR8jF3hY6bT1cA5dS0eU}
    networks:
      - monitoring

  grafana:
    container_name: grafana
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    labels:
      - "homepage.group=System"
      - "homepage.name=Grafana"
      - "homepage.icon=grafana.png"
      - "homepage.href=http://192.168.254.111:3002"
      - "homepage.target=_self"
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_UNIFIED_ALERTING_ENABLED=false
      - GF_REPORTING_ENABLED=false
      - GF_CHECK_FOR_UPDATES=false
    mem_limit: 512m
    depends_on:
      - influxdb
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
  influxdb_data:
  grafana_data:

networks:
  monitoring:
    name: monitoring
