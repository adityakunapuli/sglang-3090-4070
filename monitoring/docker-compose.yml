services:
  ####################
  # InfluxDB 2.x
  ####################
  influxdb:
    container_name: influxdb
    image: influxdb:latest
    restart: unless-stopped
    ports:
      - "8888:8086"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-home}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-telemetry}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}

  ####################
  # Vuegraf (Emporia)
  ####################
  vuegraf:
    container_name: vuegraf
    image: jertel/vuegraf:latest
    restart: unless-stopped
    volumes:
      - ./vuegraf.json:/opt/vuegraf/conf/vuegraf.json:ro
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    depends_on:
      - influxdb

  ####################
  # nvitop Exporter
  ####################
  nvitop-exporter:
    container_name: nvitop-exporter
    hostname: nvitop-exporter
    image: ghcr.io/astral-sh/uv:python3.13-trixie-slim
    restart: unless-stopped
    pid: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command: >
      bash -c "
        uv pip install --system nvitop-exporter &&
        nvitop-exporter --bind-address 0.0.0.0 --port 5050
      "

  ####################
  # Prometheus
  ####################
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nvitop-exporter

  ####################
  # Grafana
  ####################
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    user: "472"
    ports:
      - "${GRAFANA_PORT:-3333}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - influxdb
