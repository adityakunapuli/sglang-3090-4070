services:
  gateway:
    build: .
    container_name: gateway
    restart: unless-stopped
    ports:
      - "4001:4000"
    networks:
      - proxy
    volumes:
      # Mount code directories for hot-reload (no rebuild needed)
      - ./app:/app/app
      - ./static:/app/static
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
    environment:
      - CONFIG_PATH=/app/config.yaml
      - PYTHONUNBUFFERED=1
    # No --reload (unstable in container). Restart with `docker compose restart`
    # after code changes to pick up volume-mounted file changes.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "4000", "--log-level", "warning"]
    labels:
        - "homepage.group=AI"
        - "homepage.name=Gateway"
        - "homepage.icon=mdi-web"
        - "homepage.href=http://192.168.254.111:4001"
        - "homepage.description=LLM Request Gateway & Telemetry"
        - "homepage.target=_self"

networks:
  proxy:
    external: true
