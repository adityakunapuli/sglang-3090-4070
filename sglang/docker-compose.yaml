services:
  sglang:
    image: lmsysorg/sglang:dev-gemma-4-12B
    container_name: sglang
    volumes:
      - /mnt/data/models:/root/.cache/huggingface
    restart: "no"
    privileged: true
    ports:
      - "30000:30000"
    env_file:
      .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
    entrypoint: sglang serve
    command: >
      --model-path google/gemma-4-12B-it-qat-w4a16-ct
      --tp 2
      --reasoning-parser gemma4
      --tool-call-parser gemma4
      --speculative-algorithm NEXTN
      --speculative-draft-model-path google/gemma-4-12B-it-qat-q4_0-unquantized-assistant
      --speculative-num-steps 5
      --speculative-num-draft-tokens 6
      --speculative-eagle-topk 1
      --mem-fraction-static 0.85
      --host 0.0.0.0
      --port 30000
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    labels:
      - "homepage.group=AI"
      - "homepage.name=SGLang (Gemma-4-12B-QAT)"
      - "homepage.icon=/icons/sglang.png"
      - "homepage.href=http://192.168.254.111:30000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [
                'GPU-88a93309-9467-dab9-9491-30f298a784f1', # RTX 3060 12GB
                'GPU-5a6bd876-90f0-e6cf-a89e-ed47392ceb59'  # RTX 3060 12GB
              ]
              capabilities: [ gpu ]

networks:
  proxy:
    external: true
