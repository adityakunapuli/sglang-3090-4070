services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    ports:
      - "9443:9443"
      - "9000:9000"
    networks:
      - default
      - proxy
    labels:
      - "wud.watch.digest=true"
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.home.lan`)"
      - "traefik.http.routers.portainer.entrypoints=web"
      - "traefik.http.services.portainer.loadbalancer.server.port=9443"
      - "traefik.http.services.portainer.loadbalancer.server.scheme=https"
      - "homepage.group=Infrastructure"
      - "homepage.name=Portainer"
      - "homepage.icon=portainer.png"
      - "homepage.href=https://192.168.254.111:9443"
      - "homepage.target=_self"
      # - "homepage.description=Container UI"
      - "homepage.widget.type=portainer"
      - "homepage.widget.url=https://192.168.254.111:9443"
      - "homepage.target=_self"
      - "homepage.widget.key={{HOMEPAGE_VAR_PORTAINER_API_KEY}}"
      - "homepage.widget.env=3"
      - "homepage.widget.showStats=true"

networks:
  proxy:
    external: true
