<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Sidecar</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --border-muted: #21262d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --text-dim: #484f58;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --green: #3fb950;
            --yellow: #d29922;
            --red: #f85149;
            --blue: #58a6ff;
            --radius: 8px;
            --radius-sm: 4px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            min-height: 100vh
        }

        body {
            display: flex;
            flex-direction: column
        }

        /* ── header ─────────────────────────────────────────────────── */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .page-header h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-right: auto
        }

        .page-header .status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            background: #1f6feb;
            color: #fff
        }

        .page-header .status.idle {
            background: var(--border-muted);
            color: var(--text-muted)
        }

        .page-header .status.error {
            background: var(--red);
            color: #fff
        }

        /* ── tabs ───────────────────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0
        }

        .tabs button {
            padding: 10px 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: .15s
        }

        .tabs button:hover {
            color: var(--text)
        }

        .tabs button.active {
            color: #f0f6fc;
            border-bottom-color: var(--accent)
        }

        .tab {
            display: none
        }

        .tab.active {
            display: block
        }

        /* ── main container ─────────────────────────────────────────── */
        .container {
            width: 90vw;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 16px;
            flex: 1 0 auto
        }

        /* ── tabs inside container ──────────────────────────────────── */
        .container .tabs {
            margin: -20px -16px 20px;
            padding: 0 16px;
            border-bottom: 1px solid var(--border)
        }

        /* ── stat cards ─────────────────────────────────────────────── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, 1fr);
            gap: 12px;
            margin-bottom: 20px
        }

        .stat-card {
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            text-align: center
        }

        .stat-card .num {
            font-size: 28px;
            font-weight: 700
        }

        .stat-card .lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px
        }

        .stat-card .num.green {
            color: var(--green)
        }

        .stat-card .num.yellow {
            color: var(--yellow)
        }

        .stat-card .num.red {
            color: var(--red)
        }

        .stat-card .num.blue {
            color: var(--accent)
        }

        /* ── buttons ────────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            color: var(--text);
            background: var(--border-muted);
            transition: .15s;
            text-decoration: none;
            white-space: nowrap
        }

        .btn:hover {
            background: var(--border);
            border-color: var(--text-muted)
        }

        .btn-primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff
        }

        .btn-primary:hover {
            background: #388bfd;
            border-color: #388bfd
        }

        .btn-sm {
            padding: 2px 8px;
            font-size: 11px
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        /* ── activity ───────────────────────────────────────────────── */
        .activity {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px
        }

        .activity h3 {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .activity .entry {
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid var(--border-muted);
            display: flex;
            gap: 8px
        }

        .activity .entry:last-child {
            border-bottom: 0
        }

        .activity .entry .ts {
            color: var(--text-muted);
            flex-shrink: 0
        }

        .activity .entry .lvl {
            flex-shrink: 0
        }

        .activity .entry .lvl.INFO {
            color: var(--green)
        }

        .activity .entry .lvl.WARN {
            color: var(--yellow)
        }

        .activity .entry .lvl.ERROR {
            color: var(--red)
        }

        /* ── toolbar ────────────────────────────────────────────────── */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: nowrap
        }

        .toolbar select, .toolbar input, .toolbar textarea {
            padding: 6px 10px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 12px
        }

        .toolbar select {
            flex-shrink: 0
        }

        .toolbar input {
            flex: 1
        }

        /* ── table ──────────────────────────────────────────────────── */
        table {
            border-collapse: collapse;
            font-size: 12px
        }

        th {
            padding: 8px 12px;
            text-align: left;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap
        }

        td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-muted);
            white-space: nowrap
        }

        th:first-child, td:first-child {
            text-align: center;
            padding: 8px 4px
        }

        tr:hover td {
            background: var(--surface)
        }

        .doc-actions {
            display: flex;
            gap: 6px;
            align-items: center
        }

        /* ── badges ─────────────────────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600
        }

        .badge.done, .badge.ai_done {
            background: #1b3a1f;
            color: var(--green)
        }

        .badge.ocr_done {
            background: #3d2e00;
            color: var(--yellow)
        }

        .badge.pending {
            background: #3d2e00;
            color: var(--yellow)
        }

        .badge.failed {
            background: #3d1113;
            color: var(--red)
        }

        .badge.skipped {
            background: var(--border-muted);
            color: var(--text-muted)
        }

        /* ── logs ────────────────────────────────────────────────────── */
        #log-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6
        }

        #log-container .entry {
            display: flex;
            gap: 8px;
            padding: 2px 0
        }

        #log-container .entry .ts {
            color: var(--text-dim);
            flex-shrink: 0
        }

        #log-container .entry .lvl {
            flex-shrink: 0
        }

        #log-container .entry .lvl.INFO {
            color: var(--green)
        }

        #log-container .entry .lvl.WARN {
            color: var(--yellow)
        }

        #log-container .entry .lvl.ERROR {
            color: var(--red)
        }

        #log-container .entry .msg {
            color: var(--text);
            word-break: break-word
        }

        /* ── playground ──────────────────────────────────────────────── */
        .playground-layout {
            display: flex;
            gap: 16px;
            flex: 1
        }

        .playground-sidebar {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .playground-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .pg-field {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .pg-field label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
            font-weight: 600
        }

        .pg-field input, .pg-field select, .pg-field textarea {
            padding: 8px 10px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 12px
        }

        .pg-field textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.5
        }

        .pg-presets {
            display: flex;
            gap: 4px;
            flex-wrap: wrap
        }

        .pg-presets .btn {
            font-size: 11px;
            padding: 3px 10px
        }

        #pg-output {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            min-height: 300px;
            max-height: 60vh;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word
        }

        #pg-output .placeholder {
            color: var(--text-dim);
            font-family: inherit
        }

        #pg-parsed {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            max-height: 30vh;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6
        }

        #pg-parsed .placeholder {
            color: var(--text-dim)
        }

        #pg-parsed .kv {
            display: flex;
            gap: 8px;
            padding: 2px 0
        }

        #pg-parsed .kv .k {
            color: var(--accent);
            font-weight: 600;
            flex-shrink: 0
        }

        #pg-parsed .table-wrap {
            overflow-x: auto
        }

        #pg-parsed table.kv-table {
            font-size: 12px;
            margin: 6px 0
        }

        #pg-parsed table.kv-table th {
            padding: 4px 10px;
            background: var(--border-muted);
            font-size: 11px
        }

        #pg-parsed table.kv-table td {
            padding: 4px 10px;
            white-space: normal;
            word-break: break-word
        }

        .pg-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            margin-right: 6px;
            vertical-align: middle
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* ── misc ────────────────────────────────────────────────────── */
        .error-state {
            text-align: center;
            padding: 20px;
            color: var(--red)
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr)
            }

            .tabs button {
                padding: 8px 12px;
                font-size: 12px
            }

            .playground-layout {
                flex-direction: column
            }
        }
    </style>
</head>
<body>
<div class="page-header">
    <h1>&#9670; OCR Sidecar</h1>
    <span class="status" id="status-badge">starting</span>
</div>
<main class="container">
    <div class="tabs">
        <button class="active" data-tab="dashboard">Dashboard</button>
        <button data-tab="documents">Documents</button>
        <button data-tab="playground">Playground</button>
        <button data-tab="logs">Logs</button>
    </div>
    <div class="tab active" id="tab-dashboard">
        <div class="stats" id="stats"></div>
        <div style="display:flex;gap:8px;margin-bottom:20px">
            <button class="btn btn-primary" onclick="reprocessAll()" id="btn-reprocess-all">Reprocess All</button>
            <button class="btn" onclick="refreshDashboard()">Refresh</button>
        </div>
        <div class="activity" id="recent-activity"></div>
    </div>
    <div class="tab" id="tab-documents">
        <div class="toolbar">
            <select id="status-filter" onchange="renderDocs()">
                <option value="all">All</option>
                <option value="pending">Pending</option>
                <option value="done">Done</option>
                <option value="failed">Failed</option>
            </select>
            <input type="text" id="search-input" placeholder="Search title or ID..." oninput="renderDocs()">
            <button class="btn btn-primary" onclick="reprocessSelected()" id="btn-reprocess-selected">Reprocess
                Selected
            </button>
        </div>
        <div id="doc-table"></div>
    </div>
    <div class="tab" id="tab-playground">
        <div class="playground-layout">
            <div class="playground-sidebar">
                <div class="pg-field">
                    <label>Document ID</label>
                    <div style="display:flex;gap:6px">
                        <input type="number" id="pg-doc-id" placeholder="e.g. 123" style="flex:1">
                        <button class="btn btn-sm" onclick="pgFetchDoc()" id="btn-pg-fetch">Fetch</button>
                    </div>
                </div>
                <div class="pg-field">
                    <label>Doc Title</label>
                    <input type="text" id="pg-doc-title" readonly placeholder="(fetch a document first)">
                </div>
                <div class="pg-field">
                    <label>Model</label>
                    <select id="pg-model"></select>
                </div>
                <div class="pg-field">
                    <label>Temperature</label>
                    <input type="number" id="pg-temp" value="0.0" min="0" max="2" step="0.1">
                </div>
                <div class="pg-field">
                    <label>Max Tokens</label>
                    <input type="number" id="pg-max-tokens" value="4096" min="64" max="32000" step="64">
                </div>
                <div class="pg-field" style="flex:1">
                    <label>System Prompt</label>
                    <textarea id="pg-prompt" rows="8" placeholder="Enter system prompt..."></textarea>
                    <div class="pg-presets" style="margin-top:6px">
                        <button class="btn btn-sm" onclick="pgSetPreset('analyze')">Analyze & Tag</button>
                        <button class="btn btn-sm" onclick="pgSetPreset('summarize')">Summarize</button>
                        <button class="btn btn-sm" onclick="pgSetPreset('extract')">Extract Data</button>
                        <button class="btn btn-sm" onclick="pgSetPreset('ocr')">OCR Refine</button>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="pgRun()" id="btn-pg-run" disabled>Run Prompt</button>
            </div>
            <div class="playground-main">
                <div class="pg-field">
                    <label>Raw Output</label>
                    <div id="pg-output"><span class="placeholder">Run a prompt to see results</span></div>
                </div>
                <div class="pg-field">
                    <label>Parsed Metadata</label>
                    <div id="pg-parsed"><span class="placeholder">No parsed metadata yet</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class="tab" id="tab-logs">
        <div style="display:flex;gap:8px;margin-bottom:12px">
            <button class="btn" onclick="toggleAutoScroll()" id="btn-scroll">Auto-scroll</button>
            <button class="btn" onclick="clearLogs()">Clear</button>
        </div>
        <div id="log-container"></div>
    </div>
</main>
<script>
    const BASE = '';
    let autoScroll = true;
    let lastLogId = 0;
    let logTimer = null;
    let docsCache = [];
    let logCache = [];
    let paperlessUrl = '';
    let selectedDocIds = new Set();
    let pgDocData = null;

    const PG_PRESETS = {
        analyze: `You are a document metadata extractor. Analyze the document text below and return a JSON object with exactly these fields:

{
  "title": "Concise, meaningful document title (max 10 words)",
  "correspondent": "Sender or institution name (shortest recognizable form)",
  "tags": ["up to 4 relevant category tags, keep them generic and reusable"],
  "document_date": "YYYY-MM-DD format date from the document",
  "document_type": "Precise classification (e.g. Invoice, Medical Consent Form, Insurance EOB, Lab Report, Contract)",
  "AI_Summary": "Rich markdown summary with sections: ## Document Overview, ## Key Points",
  "AI_KeyDetails": "Detailed markdown table(s) capturing ALL key fields"
}

Rules:
- For tags, use only common categories (Medical, Invoice, Insurance, Legal, Tax YYYY, etc.)
- Return ONLY valid JSON. No markdown code fences, no commentary before or after.`,
        summarize: `You are a document summarizer. Provide a concise summary of the document below.

Format your response as:

## Summary
2-3 sentences capturing the document's purpose and key content.

## Key Points
- Bullet list of the most important points

## Important Dates & Figures
- Any dates, amounts, or reference numbers mentioned`,
        extract: `Extract all structured data from this document. Return as JSON:

{
  "document_type": "",
  "date": "",
  "parties": { "from": "", "to": "" },
  "amounts": [{ "label": "", "value": "", "currency": "" }],
  "reference_numbers": [],
  "key_dates": [],
  "metadata": {}
}

Return ONLY valid JSON.`,
        ocr: `Review the following OCR transcription and correct any errors you find. Fix:
- Collapsed spacing issues
- Misrecognized characters
- Preserve paragraph structure

Return the corrected text only, no commentary.`
    };

    async function api(method, path, body) {
        const opts = {method, headers: {'Accept': 'application/json'}};
        if (body) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        const r = await fetch(BASE + path, opts);
        if (!r.ok) {
            const t = await r.text();
            throw new Error(t.slice(0, 200));
        }
        const ct = r.headers.get('content-type') || '';
        return ct.includes('json') ? r.json() : r.text();
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function statusBadge(s) {
        const cls = s || 'pending';
        const lbl = {
            done: 'Done',
            ocr_done: 'OCR Processed',
            ai_done: 'AI Processed',
            pending: 'Pending',
            failed: 'Failed',
            skipped: 'Skipped',
        }[s] || s;
        return `<span class="badge ${cls}">${lbl}</span>`;
    }

    function ts(t) {
        const d = new Date(t + 'Z');
        return d.toLocaleTimeString('en-US', {hour12: false});
    }

    // Tabs
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            if (btn.dataset.tab === 'dashboard') refreshDashboard();
            if (btn.dataset.tab === 'documents') loadDocs();
            if (btn.dataset.tab === 'playground') pgInit();
            if (btn.dataset.tab === 'logs') loadLogs();
        });
    });

    // Dashboard
    async function refreshDashboard() {
        try {
            const stats = await api('GET', '/api/stats');
            const logs = await api('GET', '/api/logs?limit=15');
            renderStats(stats);
            renderRecentActivity(logs);
            document.getElementById('status-badge').textContent = 'running';
            document.getElementById('status-badge').className = 'status';
        } catch (e) {
            document.getElementById('stats').innerHTML = `<div class="error-state">Failed to load: ${escapeHtml(e.message)}</div>`;
            document.getElementById('status-badge').textContent = 'error';
            document.getElementById('status-badge').className = 'status error';
        }
    }

    function renderStats(s) {
        const cards = [
            {num: s.total, lbl: 'Total', cls: 'blue'},
            {num: s.processed, lbl: 'Processed', cls: 'green'},
            {num: s.ocr_done, lbl: 'OCR Done', cls: 'green'},
            {num: s.ai_done, lbl: 'AI Done', cls: 'green'},
            {num: s.pending, lbl: 'Pending', cls: 'yellow'},
            {num: s.failed, lbl: 'Failed', cls: 'red'},
        ];
        document.getElementById('stats').innerHTML = cards.map(c =>
            `<div class="stat-card"><div class="num ${c.cls}">${c.num}</div><div class="lbl">${c.lbl}</div></div>`
        ).join('');
    }

    function renderRecentActivity(logs) {
        const el = document.getElementById('recent-activity');
        el.innerHTML = '<h3>Recent Activity</h3>' +
            (logs.length ? logs.slice(0, 15).map(e =>
                `<div class="entry"><span class="ts">${ts(e.timestamp)}</span><span class="lvl ${e.level}">${e.level}</span><span>${escapeHtml(e.doc_id ? `Doc ${e.doc_id}: ` : '')}${escapeHtml(e.message || e.event || '')}</span></div>`
            ).join('') : '<div class="entry" style="color:var(--text-muted)">No activity yet</div>');
    }

    // Documents
    async function loadDocs() {
        try {
            const docs = await api('GET', '/api/documents');
            docsCache = docs;
            renderDocs();
        } catch (e) {
            document.getElementById('doc-table').innerHTML = `<div class="error-state">Failed to load: ${escapeHtml(e.message)}</div>`;
        }
    }

    function renderDocs() {
        const filter = document.getElementById('status-filter').value;
        const search = document.getElementById('search-input').value.toLowerCase();
        let items = docsCache;
        if (filter !== 'all') items = items.filter(d => d.status === filter);
        if (search) items = items.filter(d =>
            (d.title || '').toLowerCase().includes(search) ||
            String(d.paperless_id).includes(search)
        );

        const el = document.getElementById('doc-table');
        if (!items.length) {
            el.innerHTML = '<div style="padding:20px;color:var(--text-muted);text-align:center">No documents found</div>';
            return;
        }

        const allSelected = items.every(d => selectedDocIds.has(d.paperless_id));

        const rows = items.map(d => {
            const checked = selectedDocIds.has(d.paperless_id);
            return `<tr>
      <td><input type="checkbox" class="doc-checkbox" ${checked ? 'checked' : ''} onchange="toggleDoc(${d.paperless_id}, this.checked)"></td>
      <td>${d.paperless_id}</td>
      <td style="white-space:normal">${escapeHtml(d.title || '')}</td>
      <td>${d.page_count || '-'}</td>
      <td>${d.ocr_chars ? d.ocr_chars.toLocaleString() + 'c' : '-'}</td>
      <td>${statusBadge(d.status)}</td>
      <td>
        <div class="doc-actions">
          <a href="${paperlessUrl}documents/${d.paperless_id}" target="_blank" class="btn btn-sm">View</a>
          <button class="btn btn-sm" onclick="reprocessDoc(${d.paperless_id})">Reprocess</button>
        </div>
      </td>
    </tr>`;
        }).join('');

        el.innerHTML = `<table><thead><tr>
    <th><input type="checkbox" class="doc-checkbox" onchange="toggleAllDocs(this.checked)" ${allSelected ? 'checked' : ''}></th>
    <th>ID</th><th>Title</th><th>Pages</th><th>Chars</th><th>Status</th><th>Actions</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
    }

    function toggleDoc(id, checked) {
        if (checked) selectedDocIds.add(id);
        else selectedDocIds.delete(id);
    }

    function toggleAllDocs(checked) {
        const filter = document.getElementById('status-filter').value;
        const search = document.getElementById('search-input').value.toLowerCase();
        let items = docsCache;
        if (filter !== 'all') items = items.filter(d => d.status === filter);
        if (search) items = items.filter(d =>
            (d.title || '').toLowerCase().includes(search) ||
            String(d.paperless_id).includes(search)
        );
        items.forEach(d => {
            if (checked) selectedDocIds.add(d.paperless_id);
            else selectedDocIds.delete(d.paperless_id);
        });
        document.querySelectorAll('.doc-checkbox').forEach(cb => cb.checked = checked);
    }

    function getSelectedDocIds() {
        return Array.from(selectedDocIds).sort((a, b) => a - b);
    }

    async function reprocessSelected() {
        const ids = getSelectedDocIds();
        if (!ids.length) {
            alert('No documents selected');
            return;
        }
        const btn = document.getElementById('btn-reprocess-selected');
        btn.disabled = true;
        btn.textContent = `Reprocessing ${ids.length}...`;
        try {
            await api('POST', '/api/documents/reprocess-batch', {doc_ids: ids});
            setTimeout(() => {
                loadDocs();
            }, 1000);
        } catch (e) {
            alert('Failed: ' + e.message);
        }
        btn.disabled = false;
        btn.textContent = 'Reprocess Selected';
    }

    async function reprocessDoc(id) {
        try {
            await api('POST', `/api/documents/${id}/reprocess`);
            setTimeout(loadDocs, 1000);
        } catch (e) {
            alert('Failed: ' + e.message);
        }
    }

    async function reprocessAll() {
        const btn = document.getElementById('btn-reprocess-all');
        btn.disabled = true;
        btn.textContent = 'Processing...';
        try {
            await api('POST', '/api/reprocess-all');
            setTimeout(() => {
                refreshDashboard();
                loadDocs();
            }, 2000);
        } catch (e) {
            alert('Failed: ' + e.message);
        }
        btn.disabled = false;
        btn.textContent = 'Reprocess All';
    }

    // Playground
    async function pgInit() {
        const sel = document.getElementById('pg-model');
        if (sel.options.length) return;
        try {
            const data = await api('GET', '/api/playground/models');
            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === data.default) opt.selected = true;
                sel.appendChild(opt);
            });
        } catch (_) {
        }
        if (!pgDocData) pgSetPreset('analyze');
    }

    function pgSetPreset(name) {
        document.getElementById('pg-prompt').value = PG_PRESETS[name] || '';
    }

    async function pgFetchDoc() {
        const docId = parseInt(document.getElementById('pg-doc-id').value);
        if (!docId) {
            alert('Enter a document ID');
            return;
        }

        const btn = document.getElementById('btn-pg-fetch');
        btn.disabled = true;
        btn.textContent = 'Fetching...';
        try {
            const doc = await api('GET', `/api/documents/${docId}`);
            pgDocData = doc;
            document.getElementById('pg-doc-title').value = doc.title || `Doc #${docId}`;
            document.getElementById('btn-pg-run').disabled = false;
        } catch (e) {
            alert('Failed to fetch doc: ' + e.message);
            pgDocData = null;
            document.getElementById('pg-doc-title').value = '';
            document.getElementById('btn-pg-run').disabled = true;
        }
        btn.disabled = false;
        btn.textContent = 'Fetch';
    }

    async function pgRun() {
        if (!pgDocData) {
            alert('Fetch a document first');
            return;
        }

        const docId = parseInt(document.getElementById('pg-doc-id').value);
        const prompt = document.getElementById('pg-prompt').value.trim();
        const model = document.getElementById('pg-model').value;
        const temperature = parseFloat(document.getElementById('pg-temp').value) || 0;
        const maxTokens = parseInt(document.getElementById('pg-max-tokens').value) || 4096;

        if (!prompt) {
            alert('Enter a system prompt');
            return;
        }

        const btn = document.getElementById('btn-pg-run');
        btn.disabled = true;
        btn.innerHTML = '<span class="pg-spinner"></span>Running...';

        const output = document.getElementById('pg-output');
        const parsed = document.getElementById('pg-parsed');
        output.innerHTML = '<span class="placeholder">Waiting for response...</span>';
        parsed.innerHTML = '<span class="placeholder">Analyzing...</span>';

        try {
            const result = await api('POST', '/api/playground/prompt', {
                doc_id: docId,
                prompt: prompt,
                model: model,
                temperature: temperature,
                max_tokens: maxTokens,
            });

            output.innerHTML = escapeHtml(result.content);

            if (result.parsed) {
                let html = '<div class="kv-table-wrap">';
                for (const [key, val] of Object.entries(result.parsed)) {
                    const display = Array.isArray(val) ? val.join(', ') :
                        (typeof val === 'object' && val !== null ? JSON.stringify(val, null, 2) : String(val));
                    html += `<div class="kv"><span class="k">${escapeHtml(key)}</span><span>${escapeHtml(display)}</span></div>`;
                }
                html += '</div>';
                parsed.innerHTML = html;
            } else {
                parsed.innerHTML = '<span class="placeholder">Response was not structured JSON — raw output shown above</span>';
            }
        } catch (e) {
            output.innerHTML = `<span style="color:var(--red)">Error: ${escapeHtml(e.message)}</span>`;
            parsed.innerHTML = '<span class="placeholder">Failed to run prompt</span>';
        }

        btn.disabled = false;
        btn.innerHTML = 'Run Prompt';
    }

    // Logs
    async function loadLogs() {
        try {
            const logs = await api('GET', `/api/logs?limit=200`);
            logCache = logs;
            renderLogs(logs);
            if (logs.length) lastLogId = logs[0].id;
        } catch (e) {
            document.getElementById('log-container').innerHTML = `<div class="error-state">Failed to load: ${escapeHtml(e.message)}</div>`;
        }
        startLogPolling();
    }

    async function pollLogs() {
        try {
            const logs = await api('GET', `/api/logs?since=${lastLogId}`);
            if (logs.length) {
                logCache = logs.concat(logCache).slice(0, 500);
                renderLogs(logCache);
                lastLogId = logs[0].id;
            }
        } catch (_) {
        }
    }

    function startLogPolling() {
        if (logTimer) clearInterval(logTimer);
        logTimer = setInterval(pollLogs, 3000);
    }

    function renderLogs(logs) {
        const el = document.getElementById('log-container');
        el.innerHTML = logs.slice().reverse().map(e =>
            `<div class="entry"><span class="ts">${ts(e.timestamp)}</span><span class="lvl ${e.level}">${e.level}</span><span class="msg">${escapeHtml(e.doc_id ? `[Doc ${e.doc_id}] ` : '')}${escapeHtml(e.message || e.event || '')}</span></div>`
        ).join('');
        if (autoScroll) el.scrollTop = el.scrollHeight;
    }

    function toggleAutoScroll() {
        autoScroll = !autoScroll;
        document.getElementById('btn-scroll').classList.toggle('active');
    }

    function clearLogs() {
        document.getElementById('log-container').innerHTML = '';
        logCache = [];
    }

    // Init
    async function init() {
        try {
            const cfg = await api('GET', '/api/config');
            paperlessUrl = cfg.paperless_url;
            if (!paperlessUrl.endsWith('/')) paperlessUrl += '/';
        } catch (_) {
            paperlessUrl = '/';
        }
        refreshDashboard();
        loadDocs();
        loadLogs();
    }

    init();
</script>
</body>
</html>
