services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless_redis
    restart: "no"
    volumes:
      - ./redis:/data

  db:
    image: docker.io/library/postgres:18
    container_name: paperless_db
    restart: "no"
    volumes:
      - ./db:/var/lib/postgresql
    env_file:
      - .env

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless_web
    restart: "no"
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8010:8000"
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./data:/usr/src/paperless/data
      - /mnt/storage/documents/archive:/usr/src/paperless/media
      - /mnt/storage/documents/export:/usr/src/paperless/export
      - /mnt/storage/documents/consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    networks:
      - default
      - proxy
    labels:
      - "wud.watch.digest=true"
      - "homepage.group=Paperless Stack"
      - "homepage.name=Paperless"
      - "homepage.icon=paperless.png"
      - "homepage.href=http://192.168.254.111:8010"
      - "homepage.widget.type=paperlessngx"
      - "homepage.widget.url=http://192.168.254.111:8010"
      - "homepage.target=_self"
      - "homepage.widget.key={{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
      - "homepage.widget.showStats=true"

  gotenberg:
    image: docker.io/gotenberg/gotenberg:7.10
    container_name: paperless_gotenberg
    restart: "no"
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"

  tika:
    image: docker.io/apache/tika:latest
    container_name: paperless_tika
    labels:
      - "wud.watch.digest=true"
    restart: "no"

  ocr-sidecar:
    build: ./ocr-sidecar
    container_name: paperless_ocr_sidecar
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      webserver:
        condition: service_healthy
    volumes:
      - ./ocr-sidecar/sidecar-data:/app/data
      - ./ocr-sidecar/static:/app/static
      - ./ocr-sidecar/prompts:/app/prompts:ro
    networks:
      - default
      - proxy
    environment:
      PAPERLESS_URL: http://192.168.254.111:8010
      PAPERLESS_API_TOKEN: fb3e365ff53a0daca71494018d347afeb062fa6b
      OCR_API_URL: http://gateway:4000/v1/chat/completions
      OCR_API_KEY: paperless-ai-ocr
      OCR_MODEL: ocr
      SCAN_INTERVAL: "*/5 * * * *"
      PROCESSED_TAG: ocr-processed
      SKIP_TAG: ocr-processed
      MAX_PAGES: "50"
      MAX_TOKENS_PER_PAGE: "8192"
      AI_ANALYSIS_ENABLED: "yes"
      AI_MODEL: ocr
      AI_API_URL: http://gateway:4000/v1/chat/completions
      AI_API_KEY: paperless-ai-ocr
      MAX_ANALYSIS_TOKENS: "4096"
      LOG_LEVEL: info
    labels:
      - "wud.watch.digest=true"
      - "homepage.group=Paperless Stack"
      - "homepage.name=OCR Sidecar"
      - "homepage.icon=mdi-text-recognition"
      - "homepage.href=http://192.168.254.111:8002"
      - "homepage.target=_self"

networks:
  proxy:
    external: true
