services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless_redis
    restart: "no"
    volumes:
      - ./redis:/data

  db:
    image: docker.io/library/postgres:18
    container_name: paperless_db
    restart: "no"
    volumes:
      - ./db:/var/lib/postgresql
    env_file:
      - .env

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless_web
    restart: "no"
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8010:8000"
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./data:/usr/src/paperless/data
      - /mnt/storage/documents/archive:/usr/src/paperless/media
      - /mnt/storage/documents/export:/usr/src/paperless/export
      - /mnt/storage/documents/consume:/usr/src/paperless/consume
    env_file:
      - .env
    networks:
      - default
      - proxy
    labels:
      - "wud.watch.digest=true"
      - "homepage.group=Paperless Stack"
      - "homepage.name=Paperless"
      - "homepage.icon=paperless.png"
      - "homepage.href=http://192.168.254.111:8010"
      # - "homepage.description=Document Archive"
      - "homepage.widget.type=paperlessngx"
      - "homepage.widget.url=http://192.168.254.111:8010"
      - "homepage.target=_self"
      - "homepage.widget.key=${HOMEPAGE_VAR_PAPERLESS_KEY}"
      - "homepage.widget.showStats=true"

  gotenberg:
    image: docker.io/gotenberg/gotenberg:7.10
    container_name: paperless_gotenberg
    restart: "no"
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"

  tika:
    image: docker.io/apache/tika:latest
    container_name: paperless_tika
    labels:
      - "wud.watch.digest=true"
    restart: "no"

  paperless-ainext:
    image: admonstrator/paperless-ai-next:latest
    container_name: paperless_ainext
    restart: unless-stopped
    ports:
      - "8001:3000"
    depends_on:
      webserver:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PAPERLESS_URL=http://192.168.254.111:8010
      - PAPERLESS_API_URL=http://192.168.254.111:8010
      - >-
        SYSTEM_PROMPT=You are a personalized document analyzer. Your task is to analyze documents and extract relevant information.

                      Analyze the document content and extract the following information into a structured JSON object:

                      1. title: Create a concise, meaningful title for the document
                      2. correspondent: Identify the sender/institution but do not include addresses
                      3. tags: Select up to 4 relevant thematic tags
                      4. document_date: Extract the document date (format: YYYY-MM-DD).
                      5. document_type: Determine a precise type that classifies the document (e.g., Invoice, Tax Form, Medical Superbill, Contract)
                      6. language: ALWAYS set this to "en" (English) regardless of the document content

                      Important rules for the analysis:

                      For tags:
                      - FIRST check the existing tags before suggesting new ones.
                      - Use only relevant categories. Maximum 4 tags per document.
                      - TAX DOCUMENTS: If the document is tax-related, you MUST include a tag with the specific tax year in the format "Tax YYYY" (e.g., "Tax 2024", "Tax 2025").
                      - MEDICAL DOCUMENTS: If the document is a medical invoice, tag it with "Medical". If the document specifically relates to fertility, embryology, FET, or IVF procedures, you MUST include the tag "IVF".

                      For the title:
                      - Short and concise, NO ADDRESSES.
                      - Contains the most important identification features.
                      - For invoices/orders, mention invoice/order number if available.

                      For the correspondent:
                      - Identify the sender or institution.
                      - Always create the shortest possible form of the company name (e.g. "Amazon" instead of "Amazon EU SARL, German branch").

                      For the document date:
                      - Extract the date of the document using the format YYYY-MM-DD.
                      - If multiple dates are present, use the most relevant one (e.g., the date of service or the statement date).

                      For tax forms:
                      - Ensure that the tag says "Tax <YEAR>"--e.g., "Tax 2025" which would indicate that a given form should be filed with my 2025 taxes.  The most common types of tax forms include 1099s (Int/Div/etc) and W-2s, though may include other types as well.

                      For the language:
                      - ALWAYS set to "en" (English). Never use any other language value.
    networks:
      - default
      - proxy
    labels:
      - "wud.watch.digest=true"
      - "homepage.group=Paperless Stack"
      - "homepage.name=Paperless AI"
      - "homepage.icon=paperless.png"
      - "homepage.href=http://192.168.254.111:8001"


  surya-llama:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: surya_llama
    restart: unless-stopped
    entrypoint: >
      /app/llama-server
      --model /models/llm/OCR/surya-2.gguf
      --mmproj /models/llm/OCR/surya-2-mmproj.gguf
      --alias datalab-to/surya-ocr-2
      --host 0.0.0.0
      --port 5804
      --temp 0.0
      --top-p 0.1
      --ctx-size 32768
      --flash-attn on
      --parallel 1
    volumes:
      - /mnt/data/models:/models
    env_file:
      - .env
    networks:
      - default

  surya-ocr:
    build:
      context: ./surya-ocr
    container_name: surya_ocr
    restart: unless-stopped
    ports:
      - "8020:8000"
    env_file:
      - .env
    depends_on:
      - surya-llama
    networks:
      - default
      - proxy


networks:
  proxy:
    external: true
