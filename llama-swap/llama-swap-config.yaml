# llama-swap configuration for PC2
logToStdout: "upstream"
includeAliasesInList: true
models:
  Qwen3.8-27B:
    cmd: >
      /usr/local/bin/llama-server
      --log-colors auto
      --no-mmap
      --model /mnt/data/models/llm/Qwen3.8/Qwen3.8-27B-UD-Q4_K_XL.gguf
      --mmproj /mnt/data/models/llm/Qwen3.8/mmproj-BF16.gguf
      --alias Qwen3.8-27B
      --host 0.0.0.0
      --port ${PORT}
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --repeat_penalty 1.0
      --presence_penalty 0.0
      --flash-attn on
      --jinja
      --reasoning on
      --chat-template-kwargs '{"preserve_thinking":true,"enable_thinking":true}'
      --ctx-size 262144
      --split-mode layer
      --spec-type draft-mtp,ngram-mod
      --spec-draft-n-max 2
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 48
      --spec-ngram-mod-n-max 64
      --tensor-split 77,23
      --n-gpu-layers 99
      --fit off
      --cache-type-k  q8_0
      --cache-type-v q8_0
#      --tensor-split 83.33,16.67
#      --fit-target 500,4000
    #      --batch-size 2048
    #      --split-mode tensor
    #      --ubatch-size 1024
    #      --parallel 2
    #      --threads 4
    #      --threads-batch 4
    #      --tensor-split 1,1.09
    #      --defrag-thold 0.1
    filters:
      setParamsByID:
        "${MODEL_ID}:xhigh":
          chat_template_kwargs:
            reasoning_effort: "xhigh"
            enable_thinking: true
            preserve_thinking: true
        "${MODEL_ID}:medium":
          chat_template_kwargs:
            reasoning_effort: "medium"
            enable_thinking: true
            preserve_thinking: true
        "${MODEL_ID}:low":
          chat_template_kwargs:
            reasoning_effort: "low"
            enable_thinking: true
            preserve_thinking: true
        "${MODEL_ID}:none":
          reasoning: "off"
          temperature: 0.7
          top_p: 0.80
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0
          chat_template_kwargs:
            enable_thinking: false
    aliases:
      - "Qwen3.8-27B:xhigh"
      - "Qwen3.8-27B:medium"
      - "Qwen3.8-27B:low"
      - "Qwen3.8-27B:none"
    ttl: 0

