##
  Gemma-4-12B-MTP:
    cmd: >
      /usr/local/bin/llama-server
      --log-colors auto
      --model /mnt/data/models/llm/Gemma/12B/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /mnt/data/models/llm/Gemma/12B/mmproj-BF16.gguf
      --model-draft /mnt/data/models/llm/Gemma/12B/mtp-gemma-4-12b-it.gguf
      --alias Gemma-4-12B-MTP
      --host 0.0.0.0
      --port ${PORT}
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --min-p 0.01
      --n-predict 2048
      --reasoning on
      --chat-template-kwargs '{"enable_thinking": true}'
      --split-mode layer
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --flash-attn on
      --parallel 2
      --ctx-size 262144
    filters:
      setParamsByID:
        "${MODEL_ID}:fast":
          reasoning: "off"
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:low":
          reasoning_budget_message: "Thinking budget exceeded answer now."
          thinking_budget_tokens: 1024
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
        "${MODEL_ID}:high":
          thinking_budget_tokens: -1
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
    aliases:
      - "Gemma-4-12B-MTP:fast"
      - "Gemma-4-12B-MTP:low"
      - "Gemma-4-12B-MTP:high"
    ttl: 0
