  Gemma4-31B-QAT:
    cmd: >
      /usr/local/bin/llama-server
      --model /mnt/data/models/llm/Gemma/31B/gemma-4-31B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /mnt/data/models/llm/Gemma/31B/mmproj-BF16.gguf
      --model-draft /mnt/data/models/llm/Gemma/31B/mtp-gemma-4-31B-it.gguf
      --alias Gemma4-31B-QAT
      --host 0.0.0.0
      --port ${PORT}
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --min-p 0.01
      --repeat-penalty 1.0
      --n-predict 2048
      --reasoning on
      --chat-template-kwargs '{"enable_thinking": true,"preserve_thinking": true}'
      --split-mode layer
      --n-gpu-layers 99
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --flash-attn on
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --ctx-size 131072
      --fit off
      --tensor-split 70,30

    ttl: 0

  Gemma4-26B-A4B-QAT:
    cmd: >
      /usr/local/bin/llama-server
      --model /mnt/data/models/llm/Gemma/26B-A4B/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /mnt/data/models/llm/Gemma/26B-A4B/mmproj-BF16.gguf
      --model-draft /mnt/data/models/llm/Gemma/26B-A4B/mtp-gemma-4-26B-A4B-it-BF16.gguf
      --alias Gemma4-26B-A4B-QAT
      --host 0.0.0.0
      --port ${PORT}
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --min-p 0.01
      --reasoning on
      --chat-template-kwargs '{"enable_thinking": true}'
      --split-mode layer
      --n-gpu-layers 99
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --flash-attn on
      --parallel 1
      --ctx-size 262144
      --fit off
      --tensor-split 70,30
  #      --repeat-penalty 1.0
  #      --n-predict 2048

    ttl: 0

  Muse-Glimmer-30B:
    cmd: >
      /usr/local/bin/llama-server
      --log-colors auto
      --model /mnt/data/models/llm/Meta/Muse-Glimmer-30B-UD-Q4_K_XL.gguf
      --mmproj /mnt/data/models/llm/Meta/mmproj-kquant.gguf
      --model-draft /mnt/data/models/llm/Meta/dflash-kquant.gguf
      --alias Muse-Glimmer-30B
      --host 0.0.0.0
      --port ${PORT}
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --min-p 0.0
      --flash-attn on
      --jinja
      --reasoning on
      --chat-template-kwargs '{"preserve_thinking":true,"enable_thinking":true}'
      --split-mode layer
      --n-gpu-layers 99
      --spec-type draft-dflash,ngram-mod
      --spec-draft-n-max 2
      --spec-ngram-mod-n-match 24
      --spec-ngram-mod-n-min 48
      --spec-ngram-mod-n-max 64
      --no-mmap
      --parallel 1
      --ctx-size 131072
      --cache-type-k q8_0
      --cache-type-v q8_0
      --fit off
      --tensor-split 100,0
    filters:
      setParamsByID:
        "${MODEL_ID}:fast":
          reasoning: "off"
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:low":
          thinking_budget_tokens: 1024
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
        "${MODEL_ID}:high":
          thinking_budget_tokens: -1
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
    aliases:
      - "Muse-Glimmer-30B:fast"
      - "Muse-Glimmer-30B:low"
      - "Muse-Glimmer-30B:high"
    ttl: 0

