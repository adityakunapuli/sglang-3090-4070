# llama-swap configuration for PC2
logToStdout: "upstream"
includeAliasesInList: true
models:
  Qwen3.6-27B:
    cmd: >
      /usr/local/bin/llama-server
      --log-colors auto
      --model /mnt/data/models/llm/Qwen3.6/27B-MTB/Qwen3.6-27B-Q4_K_S.gguf
      --mmproj /mnt/data/models/llm/Qwen3.6/27B-MTB/mmproj-BF16.gguf
      --alias Qwen3.6-27B
      --host 0.0.0.0
      --port ${PORT}
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --flash-attn on
      --jinja
      --reasoning on
      --chat-template-kwargs '{"preserve_thinking":true}'
      --split-mode tensor
      --fit off
      --n-gpu-layers 99
      --ctx-size 65536
      --cache-type-k  q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 1024
#      --parallel 2
#      --threads 4
#      --threads-batch 4
#      --tensor-split 1,1.09
#      --defrag-thold 0.1
#      --spec-default
#      --spec-type ngram-map-k4v
#      --spec-ngram-map-k4v-size-n 16
#      --spec-ngram-map-k4v-size-m 24
#      --spec-ngram-map-k4v-min-hits 1
    filters:
      setParamsByID:
        "${MODEL_ID}:fast":
          reasoning: "off"
          chat_template_kwargs:
            enable_thinking: false
        "${MODEL_ID}:low":
          reasoning_budget_message: "Thinking budget exceeded answer now."
          thinking_budget_tokens: 1024
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
        "${MODEL_ID}:high":
          thinking_budget_tokens: -1
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
    aliases:
      - "Qwen3.6-27B:fast"
      - "Qwen3.6-27B:low"
      - "Qwen3.6-27B:high"
    ttl: 0
