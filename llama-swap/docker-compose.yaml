services:
  # llama-swap - Manages llama-server processes for hot-swapping
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama-swap
    user: root
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /mnt/data/models/llm:/mnt/data/models/llm
      - ./llama-swap-config.yaml:/app/llama-swap-config.yaml:ro
    environment:
      - LLAMA_CACHE=/mnt/data/models/llm
      - HF_HOME=/mnt/data/models/llm
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    command: ["--config", "/app/llama-swap-config.yaml", "--listen", "0.0.0.0:8080"]
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [
#                '0','1','2'
                'GPU-88a93309-9467-dab9-9491-30f298a784f1', # RTX 3060 12GB
                'GPU-5a6bd876-90f0-e6cf-a89e-ed47392ceb59'  # RTX 3060 12GB
              ]
              capabilities: [ gpu ]
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llama-swap.rule=Host(`llama-swap.local`) || Host(`llama-swap`)"
      - "traefik.http.routers.llama-swap.entrypoints=web"
      - "traefik.http.services.llama-swap.loadbalancer.server.port=8080"
      - "homepage.group=AI"
      - "homepage.name=Llama Swap"
      - "homepage.icon=/icons/llama.png"
      - "homepage.href=http://192.168.254.111:8082"
      # - "homepage.description=LLM Hot-Swapper & UI"

volumes:
  litellm_db_data:

networks:
  proxy:
    external: true
