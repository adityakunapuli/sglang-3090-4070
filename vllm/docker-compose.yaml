services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    volumes:
      - /mnt/data/models/hf:/root/.cache/huggingface
    restart: "no"
    privileged: true
    ports:
      - "7777:7777"
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      --model Lorbus/Qwen3.6-27B-int4-AutoRound
      --tensor-parallel-size 2
      --dtype half
      --max-model-len 4096
      --gpu-memory-utilization 0.85
      --kv-cache-dtype fp8
      --max-num-seqs 1
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --trust-remote-code
      --compilation-config.cudagraph_mode none
      --disable-custom-all-reduce
      --host 0.0.0.0
      --port 7777
    labels:
      - "homepage.group=AI"
      - "homepage.name=vLLM"
      - "homepage.icon=/icons/vllm.png"
      - "homepage.href=http://192.168.254.111:7777"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [
                'GPU-88a93309-9467-dab9-9491-30f298a784f1',
                'GPU-5a6bd876-90f0-e6cf-a89e-ed47392ceb59'
              ]
              capabilities: [ gpu ]

networks:
  proxy:
    external: true
