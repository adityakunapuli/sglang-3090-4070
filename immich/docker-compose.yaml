services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      # THE DESTINATION: Immich will manage this folder.
      # It will create "library", "thumbs", "encoded-video", etc. here.
      - /mnt/storage/media/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Database Connection
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE_NAME=immich
      # Redis Connection
      - REDIS_HOSTNAME=immich_redis
      - NVIDIA_VISIBLE_DEVICES=${GPU_SLOT_3:?GPU_SLOT_3_NOT_SET}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "2283:2283"
    networks:
      - default
      - proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Passes both cards so NVDEC peer-checking initialization passes
              capabilities: [ gpu, compute, video ]
    labels:
      - "wud.watch.digest=true"
    #      - "homepage.group=Home Ops"
    #      - "homepage.id=immich-card"
    #      - "homepage.name=Immich"
    #      - "homepage.icon=immich.png"
    #      - "homepage.href=http://192.168.254.111:2283"
    #      - "homepage.target=_self"
    depends_on:
      - immich_redis
      - immich_postgres
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    # CUDA tag for the RTX 3060 (GPU_SLOT_3)
    # NOTE: ML image doesn't get a `-cuda` variant on `main`; pin to release while
    # server tracks main to pick up the HLS variant-config fix (PR #29613).
    image: ghcr.io/immich-app/immich-machine-learning:main-cuda
    labels:
      - "wud.watch.digest=true"
    environment:
      # We define the specific UUID in the deploy block, but keeping this
      # can be helpful for internal scripts or debugging within the container.
      # To see GPU UUID, use `nvidia-smi -L`
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      #      - MACHINE_LEARNING_MODEL_TTL=0
      #      - MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL=ViT-B-16-SigLIP2__webli
      #      - MACHINE_LEARNING_PRELOAD__CLIP__VISUAL=ViT-B-16-SigLIP2__webli
      #      - MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL=ViT-L-16-SigLIP2-256__webli
      #      - MACHINE_LEARNING_PRELOAD__CLIP__VISUAL=ViT-L-16-SigLIP2-256__webli
      # the following doesn't play with frigate
    #      - MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL=ViT-SO400M-16-SigLIP2-384__webli
    #      - MACHINE_LEARNING_PRELOAD__CLIP__VISUAL=ViT-SO400M-16-SigLIP2-384__webli
    volumes:
      - model-cache:/cache
    restart: always
    ports:
      - "3003:3003" # useful for debugging

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - ${GPU_SLOT_3:?GPU_SLOT_3_NOT_SET}
              capabilities:
                - all

  immich_redis:
    container_name: immich_redis
    image: redis:6.2-alpine@sha256:d6c2911ac51b289db208767581a5d154544f2b2fe4914ea5056443f62dc6e900
    restart: always
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 30s
      timeout: 30s
      retries: 50
      start_period: 5s
  immich_postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    #    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    #    image: tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      # Stores DB data in a local folder './postgres' relative to this compose file
      - ./postgres:/var/lib/postgresql/data
    restart: always
volumes:
  model-cache: null
networks:
  proxy:
    external: true
