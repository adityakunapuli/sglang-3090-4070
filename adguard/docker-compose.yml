services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
#    restart: unless-stopped
    ports:
      # Bind DNS specifically to Local and Tailscale IPs to avoid libvirt conflict
      - "192.168.254.111:53:53/tcp"
      - "192.168.254.111:53:53/udp"
      - "100.124.95.75:53:53/tcp"
      - "100.124.95.75:53:53/udp"
      - "3001:80/tcp"     # Web UI (Post-setup)
#      - "53:53/tcp" # Critical for DNS
#      - "53:53/udp" # Critical for DNS

    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    networks:
      - default
      - proxy
    labels:
      - "wud.watch.digest=true"
      - "traefik.enable=true"
      - "traefik.http.routers.adguard.rule=Host(`adguard.home.lan`)"
      - "traefik.http.routers.adguard.entrypoints=web"
      - "traefik.http.services.adguard.loadbalancer.server.port=80"
      - "homepage.group=Home Ops"
      - "homepage.name=AdGuard Home"
      - "homepage.icon=adguard-home.png"
      - "homepage.href=http://192.168.254.111:3001"
      - "homepage.target=_self"

networks:
  proxy:
    external: true
